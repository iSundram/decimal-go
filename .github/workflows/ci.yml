name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Format
        run: |
          if [ -n "$(gofmt -l . | grep -v '^xvalidate/')" ]; then
            echo "gofmt needed:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Race detector
        run: go test -race -count=1 .

      - name: Coverage summary
        run: go test -coverprofile=coverage.out . && go tool cover -func=coverage.out | tail -n1

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzNewString, FuzzArith, FuzzPowNew, FuzzTrig]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Corpus regression
        run: go test -count=1 ./...

      - name: Fuzz ${{ matrix.target }}
        run: go test -fuzz=${{ matrix.target }} -fuzztime=30s -run '^$' .