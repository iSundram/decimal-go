name: Update CHANGELOG

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync_unreleased:
    if: github.repository == 'iSundram/decimal-go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync [Unreleased] from draft release body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/update_changelog.py sync

      - name: Commit changelog if changed
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs: auto-update CHANGELOG [Unreleased]"
            git push
          fi
