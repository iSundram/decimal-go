name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'bug'
      - 'fix'
  default: patch
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '🧪 Tests & quality'
    labels:
      - 'tests'
      - 'quality'
      - 'ci'
exclude-labels:
  - 'skip-changelog'
publish-labels:
  - 'release'
autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - 'docs/**'
  - label: 'ci'
    files:
      - '.github/**'
  - label: 'tests'
    files:
      - '*_test.go'
      - 'xvalidate/**'
      - 'bench/**'
template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/iSundram/decimal-go/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
