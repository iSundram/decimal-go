<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@600&amp;display=swap');
      .logo-text {
        font-family: 'Raleway', sans-serif;
        font-size: 42px;
        font-weight: 600;
        fill: #d4d4d4;
        letter-spacing: 1px;
      }
    </style>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#2b2b2b" rx="10" ry="10" />
  
  <!-- Text perfectly centered -->
  <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" class="logo-text">
    decimal-go
  </text>
</svg>
